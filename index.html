<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <link rel="shortcut icon" href="./assets/icons/chrome-icon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer">Gmail</a>
        <div class="apps-wrap">
          <button id="appsToggle" class="apps" type="button" aria-label="Google apps" aria-haspopup="true" aria-expanded="false">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </button>
          <div id="appsMenu" class="apps-menu" role="menu" aria-label="Google products">
            <div class="apps-menu-shell">
              <section class="favorites-card" aria-label="Your favorites">
                <div class="favorites-head">
                  <h2>Your favorites</h2>
                </div>
                <div class="apps-grid">
                  <a class="apps-tile" href="https://myaccount.google.com/" target="_blank" rel="noopener noreferrer">
                    <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_48dp.png" alt="" /></span>
                    <span>Account</span>
                  </a>
                  <a class="apps-tile" href="https://drive.google.com/" target="_blank" rel="noopener noreferrer">
                    <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/drive_2020q4_48dp.png" alt="" /></span>
                    <span>Drive</span>
                  </a>
                  <a class="apps-tile" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
                    <span class="apps-item-icon"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="" /></span>
                    <span>YouTube</span>
                  </a>
                  <a class="apps-tile" href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">
                    <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/calendar_2020q4_48dp.png" alt="" /></span>
                    <span>Calendar</span>
                  </a>
                <a class="apps-tile" href="https://meet.google.com/" target="_blank" rel="noopener noreferrer">
                  <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/meet_2020q4_48dp.png" alt="" /></span>
                  <span>Meet</span>
                </a>
                <a class="apps-tile" href="https://translate.google.com/" target="_blank" rel="noopener noreferrer">
                  <span class="apps-item-icon"><img src="https://www.google.com/s2/favicons?domain=translate.google.com&sz=128" alt="" /></span>
                  <span>Translate</span>
                </a>
                <a class="apps-tile" href="https://docs.google.com/spreadsheets/" target="_blank" rel="noopener noreferrer">
                  <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/sheets_2020q4_48dp.png" alt="" /></span>
                  <span>Sheets</span>
                </a>
                <a class="apps-tile" href="https://docs.google.com/document/" target="_blank" rel="noopener noreferrer">
                  <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/docs_2020q4_48dp.png" alt="" /></span>
                  <span>Docs</span>
                </a>
                <a class="apps-tile" href="https://docs.google.com/presentation/" target="_blank" rel="noopener noreferrer">
                  <span class="apps-item-icon"><img src="https://www.gstatic.com/images/branding/product/2x/slides_2020q4_48dp.png" alt="" /></span>
                  <span>Slides</span>
                </a>
                </div>
              </section>
              <a
                class="apps-more-btn"
                href="https://about.google/products/"
                target="_blank"
                rel="noopener noreferrer"
              >
                More from Google
              </a>
            </div>
          </div>
        </div>
      </header>
      <main class="hero">
        <form id="searchForm" class="search-bar" autocomplete="off">
          <span class="s-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
            </svg>
          </span>
          <label class="sr-only" for="searchInput">Search Google or type a URL</label>
          <input id="searchInput" type="text" placeholder="Search Google or type a URL" />
          <ul id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions"></ul>
        </form>

        <ul id="shortcutsList" class="shortcuts" aria-label="Shortcuts"></ul>

        <section class="widgets-panel" aria-label="Widgets">
          <article class="widget-card weather-widget">
            <div class="widget-head">
              <h3>Погода</h3>
            </div>
            <form id="weatherForm" class="widget-form" autocomplete="off">
              <span class="weather-location-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21c3.6-3.8 6-6.7 6-10a6 6 0 1 0-12 0c0 3.3 2.4 6.2 6 10Z"></path>
                  <circle cx="12" cy="11" r="2.2"></circle>
                </svg>
              </span>
              <input id="weatherCityInput" type="text" placeholder="Город (можно по-русски)" />
            </form>
            <div id="weatherContent" class="widget-content">Загружаю погоду...</div>
          </article>

          <article class="widget-card currency-widget">
            <div class="widget-head">
              <h3>Курсы валют</h3>
            </div>
            <div id="currencyContent" class="widget-content">Загружаю курсы...</div>
          </article>

          <article class="widget-card ip-widget">
            <div class="widget-head">
              <h3>IP и регион</h3>
              <button id="refreshIpBtn" class="widget-refresh-btn" type="button" aria-label="Refresh IP">↻</button>
            </div>
            <div class="ip-graphic" aria-hidden="true">
              <svg viewBox="0 0 96 96" fill="none">
                <circle cx="18" cy="20" r="6"></circle>
                <circle cx="48" cy="16" r="6"></circle>
                <circle cx="78" cy="30" r="6"></circle>
                <circle cx="22" cy="62" r="6"></circle>
                <circle cx="52" cy="54" r="6"></circle>
                <circle cx="78" cy="74" r="6"></circle>
                <path d="M24 20h18M54 18l18 9M21 26l-2 30M28 58l18-4M57 58l15 12"></path>
              </svg>
            </div>
            <div id="ipContent" class="widget-content">Loading IP…</div>
          </article>
        </section>
      </main>

    </div>

    <dialog id="shortcutDialog" class="shortcut-dialog">
      <form id="shortcutForm" class="dialog-form" method="dialog" autocomplete="off">
        <h2 id="shortcutDialogTitle">Add shortcut</h2>
        <label>
          Name
          <input id="shortcutName" type="text" maxlength="30" required />
        </label>
        <label>
          URL
          <input id="shortcutUrl" type="url" placeholder="https://example.com" required />
        </label>
        <label>
          Icon URL (optional)
          <input id="shortcutIcon" type="url" placeholder="https://example.com/icon.png" />
        </label>
        <div class="dialog-actions">
          <button id="cancelDialog" type="button">Cancel</button>
          <button type="submit">Done</button>
        </div>
      </form>
    </dialog>

    <template id="shortcutTemplate">
      <li class="shortcut-item">
        <button class="shortcut-menu-btn" type="button" aria-label="More actions">⋮</button>
        <div class="shortcut-menu" role="menu">
          <button class="shortcut-action-edit" type="button" role="menuitem">Edit shortcut</button>
          <button class="shortcut-action-remove" type="button" role="menuitem">Remove</button>
        </div>
        <a class="shortcut-link" target="_blank" rel="noopener noreferrer" title="Open shortcut">
          <span class="shortcut-icon"></span>
          <span class="shortcut-label"></span>
        </a>
      </li>
    </template>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
