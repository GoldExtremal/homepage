<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <link rel="shortcut icon" href="./assets/icons/chrome-icon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="gmail-link" href="https://mail.google.com">
          <img src="./assets/icons/gmail-icon.svg" alt="" aria-hidden="true" />
          <span>Gmail</span>
        </a>
        <div class="apps-wrap">
          <button id="appsToggle" class="apps" type="button" aria-label="Google apps" aria-haspopup="true" aria-expanded="false">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </button>
        </div>
        <div class="settings-wrap">
          <button id="settingsToggle" class="settings-btn" type="button" aria-label="Page settings" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.4"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.06.06a2 2 0 1 1-2.82 2.82l-.06-.06a1.7 1.7 0 0 0-1.86-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.86.34l-.06.06a2 2 0 1 1-2.82-2.82l.06-.06a1.7 1.7 0 0 0 .34-1.86 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.04 1.7 1.7 0 0 0-.34-1.86l-.06-.06a2 2 0 1 1 2.82-2.82l.06.06a1.7 1.7 0 0 0 1.86.34A1.7 1.7 0 0 0 10.04 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.86-.34l.06-.06a2 2 0 1 1 2.82 2.82l-.06.06a1.7 1.7 0 0 0-.34 1.86A1.7 1.7 0 0 0 21 10.04h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.56 1.04Z"></path>
            </svg>
          </button>
        </div>
      </header>
      <div id="settingsMenu" class="overlay-menu settings-menu" role="menu" aria-label="Page settings">
        <h3>Settings</h3>
        <div class="settings-item">
          <span>Dark mode</span>
          <label class="toggle is-disabled" for="toggleDarkMode" aria-label="Dark mode (coming soon)" aria-disabled="true">
            <input id="toggleDarkMode" type="checkbox" checked disabled aria-label="Dark mode" />
            <span class="toggle-track"></span>
          </label>
        </div>
        <button id="clearSearchHistoryBtn" class="settings-action-btn" type="button">Clear search history</button>
        <button id="setCustomBackgroundBtn" class="settings-action-btn" type="button">Set custom background</button>
        <div class="settings-subheading">Shortcuts</div>
        <div class="settings-item">
          <span>Show shortcuts</span>
          <label class="toggle" for="toggleShortcuts" aria-label="Toggle shortcuts visibility">
            <input id="toggleShortcuts" type="checkbox" aria-label="Show shortcuts" />
            <span class="toggle-track"></span>
          </label>
        </div>
        <button id="resetShortcutsBtn" class="settings-action-btn" type="button">Reset shortcuts</button>
        <div class="settings-subheading">Widgets</div>
        <div class="settings-item">
          <span>Show widgets</span>
          <label class="toggle" for="toggleWidgets" aria-label="Toggle widgets visibility">
            <input id="toggleWidgets" type="checkbox" aria-label="Show widgets" />
            <span class="toggle-track"></span>
          </label>
        </div>
        <button id="clearWidgetsDataBtn" class="settings-action-btn" type="button">Clear widgets data</button>
        <button id="resetUserDataBtn" class="settings-reset-btn" type="button">Reset all user data</button>
      </div>
      <div id="appsMenu" class="overlay-menu apps-menu" role="menu" aria-label="Google services"></div>
      <main class="hero">
        <form id="searchForm" class="search-bar" autocomplete="off">
          <span class="s-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
            </svg>
          </span>
          <label class="sr-only" for="searchInput">Search Google or type a URL</label>
          <input id="searchInput" type="text" placeholder="Search Google or type a URL" />
          <ul id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions"></ul>
        </form>

        <ul id="shortcutsList" class="shortcuts" aria-label="Shortcuts"></ul>

        <section class="widgets-panel" aria-label="Widgets">
          <article class="widget-card weather-widget" data-widget-id="weather">
            <div class="widget-head">
              <h3>Погода</h3>
            </div>
            <form id="weatherForm" class="widget-form" autocomplete="off">
              <span class="weather-location-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21c3.6-3.8 6-6.7 6-10a6 6 0 1 0-12 0c0 3.3 2.4 6.2 6 10Z"></path>
                  <circle cx="12" cy="11" r="2.2"></circle>
                </svg>
              </span>
              <input id="weatherCityInput" type="text" placeholder="Город" />
            </form>
            <div id="weatherContent" class="widget-content">Загружаю погоду...</div>
          </article>

          <article class="widget-card currency-widget" data-widget-id="currency">
            <div class="widget-head">
              <h3>Курсы валют</h3>
            </div>
            <div id="currencyContent" class="widget-content">Загружаю курсы...</div>
          </article>

          <article class="widget-card ip-widget" data-widget-id="ip">
            <div class="widget-head">
              <h3>IP и регион</h3>
            </div>
            <div class="ip-graphic" aria-hidden="true">
              <svg viewBox="0 0 96 96" fill="none">
                <circle cx="18" cy="20" r="6"></circle>
                <circle cx="48" cy="16" r="6"></circle>
                <circle cx="78" cy="30" r="6"></circle>
                <circle cx="22" cy="62" r="6"></circle>
                <circle cx="52" cy="54" r="6"></circle>
                <circle cx="78" cy="74" r="6"></circle>
                <path d="M24 20h18M54 18l18 9M21 26l-2 30M28 58l18-4M57 58l15 12"></path>
              </svg>
            </div>
            <div id="ipContent" class="widget-content">Loading IP…</div>
          </article>
        </section>
      </main>

    </div>

    <dialog id="shortcutDialog" class="shortcut-dialog">
      <form id="shortcutForm" class="dialog-form" method="dialog" autocomplete="off">
        <h2 id="shortcutDialogTitle">Add shortcut</h2>
        <label>
          Name
          <input id="shortcutName" type="text" maxlength="30" required />
        </label>
        <label>
          URL
          <input id="shortcutUrl" type="url" placeholder="https://example.com" required />
        </label>
        <label>
          Icon URL (optional)
          <input id="shortcutIcon" type="url" placeholder="https://example.com/icon.png" />
        </label>
        <div class="dialog-actions">
          <button id="cancelDialog" type="button">Cancel</button>
          <button type="submit">Done</button>
        </div>
      </form>
    </dialog>

    <template id="shortcutTemplate">
      <li class="shortcut-item">
        <button class="shortcut-menu-btn" type="button" aria-label="More actions">⋮</button>
        <div class="shortcut-menu" role="menu">
          <button class="shortcut-action-edit" type="button" role="menuitem">Edit shortcut</button>
          <button class="shortcut-action-remove" type="button" role="menuitem">Remove</button>
        </div>
        <a class="shortcut-link" title="Open shortcut">
          <span class="shortcut-icon"></span>
          <span class="shortcut-label"></span>
        </a>
      </li>
    </template>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
